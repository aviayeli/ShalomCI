# קונפיגורציית שרת עבור פריסה על שרת Ubuntu ללא ראש (headless) מאחורי Reverse Proxy (כגון NGINX).
# headless=true מונע מ-Streamlit לנסות לפתוח דפדפן מקומי בעת ההפעלה.
# enableCORS/enableXsrfProtection מכובים כדי למנוע חסימת בקשות WebSocket וכשלי "Please wait..."
# כשה-Proxy מגיש את האפליקציה תחת דומיין/נתיב שונה מזה שה-WebSocket Handshake מצפה לו.
[server]
headless = true
enableCORS = false
enableXsrfProtection = false

# ערכת הנושא של מערכת העיצוב ShalomCI (Claude Design) - תואמת לטוקנים ב-DESIGN_CSS
# (--sci-primary/--sci-bg/--sci-surface/--sci-text) שמוזרקים ב-src/gui/ui_helpers.py.
[theme]
primaryColor = "#2F6BDB"
backgroundColor = "#F4F6F9"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1B2431"
font = "sans serif"
