# דוגמת קונפיגורציה ל-Nginx כ-Reverse Proxy מול Streamlit (ShalomCI) על שרת headless.
# מטרת הקובץ: למנוע ניתוקי WebSocket ומסכי "Please wait..." אינסופיים, שנגרמים כאשר
# ה-Proxy לא מעביר את כותרות ה-Upgrade/Connection הנדרשות ל-handshake של WebSocket,
# או כאשר timeout קצר מדי סוגר את החיבור המתמשך (long-lived) של /_stcore/stream.
#
# התקנה: העתיקו/קשרו קובץ זה אל /etc/nginx/sites-available/shalomci,
# עדכנו server_name לדומיין שלכם, ואז:
#   sudo ln -s /etc/nginx/sites-available/shalomci /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream shalomci_streamlit {
    server 127.0.0.1:8501;
}

server {
    listen 80;
    server_name shalomci.example.com;

    # Streamlit דורש HTTP/1.1 עבור שדרוג (upgrade) ל-WebSocket.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # כותרות Upgrade/Connection - חובה כדי שה-handshake של WebSocket יעבור דרך ה-Proxy
    # ולא ייפול חזרה לבקשת HTTP רגילה (מה שגורם למסך "Please wait..." שלא מתקדם).
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # timeout ארוך יותר מברירת המחדל (60s) כדי שה-Proxy לא ינתק חיבור WebSocket
    # פעיל ותקין רק בגלל שהוא נשאר פתוח זמן רב בין הודעות.
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;

    location / {
        proxy_pass http://shalomci_streamlit;
    }

    # נתיב ה-WebSocket הייעודי של Streamlit - קריטי לעדכוני מצב בזמן אמת.
    location /_stcore/stream {
        proxy_pass http://shalomci_streamlit/_stcore/stream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }
}
